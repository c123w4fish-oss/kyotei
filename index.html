<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最強 競艇AI予想アナリスト</title>
    <style>
        :root {
            --b1: #ffffff; --b2: #1c1c1c; --b3: #ff3b30;
            --b4: #007afc; --b5: #ffcc00; --b6: #34c759;
        }
        body { background-color: #121214; color: #ffffff; font-family: sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; }
        h1 { color: #FFD700; text-align: center; font-size: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.3); margin-bottom: 5px; }
        .sub { text-align: center; color: #888; font-size: 11px; margin-bottom: 20px; }
        .card { background: #1e1e22; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2d2d35; }
        label { display: block; margin-top: 8px; font-size: 11px; color: #aaa; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; background: #2a2a30; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; margin-top: 3px; }
        input:focus { border-color: #FFD700; outline: none; }
        .save-box { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #FFD700; }
        .save-box input { width: auto; margin: 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .boat-row { padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #25252b; }
        .b1 { border-left: 6px solid var(--b1); } .b2 { border-left: 6px solid var(--b2); }
        .b3 { border-left: 6px solid var(--b3); } .b4 { border-left: 6px solid var(--b4); }
        .b5 { border-left: 6px solid var(--b5); } .b6 { border-left: 6px solid var(--b6); }
        .boat-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #FFD700, #FFA500); border: none; color: #000; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(255,215,0,0.2); }
        #result { background: #131a35; padding: 18px; border-radius: 12px; margin-top: 20px; white-space: pre-wrap; display: none; border: 1px solid #FFD700; line-height: 1.6; font-size: 14px; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .loading { text-align: center; color: #FFD700; display: none; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>BOATRACE AI ANALYST</h1>
    <div class="sub">自動記憶・表示バグ完全修正版</div>

    <!-- APIキー入力欄 -->
    <div class="card">
        <label>Google AI Studio API Key (無料)</label>
        <input type="password" id="apiKey" placeholder="AQ. から始まるキーを入力">
        <div class="save-box">
            <input type="checkbox" id="saveKey" checked>
            <label for="saveKey" style="display:inline; margin:0; color:#FFD700; cursor:pointer;">このiPhoneにキーを記憶させる</label>
        </div>
    </div>

    <!-- 1号艇〜6号艇のデータ入力欄 -->
    <div class="card">
        <div class="boat-row b1"><div class="boat-title">1号艇</div><div class="grid-2"><div><label>展示タイム</label><input type="number" step="0.01" id="t1" value="6.70"></div><div><label>展示ST</label><input type="number" step="0.01" id="st1" value="0.15"></div></div></div>
        <div class="boat-row b2"><div class="boat-title">2号艇</div><div class="grid-2"><div><label>展示タイム</label><input type="number" step="0.01" id="t2" value="6.75"></div><div><label>展示ST</label><input type="number" step="0.01" id="st2" value="0.12"></div></div></div>
        <div class="boat-row b3"><div class="boat-title">3号艇</div><div class="grid-2"><div><label>展示タイム</label><input type="number" step="0.01" id="t3" value="6.72"></div><div><label>展示ST</label><input type="number" step="0.01" id="st3" value="0.18"></div></div></div>
        <div class="boat-row b4"><div class="boat-title">4号艇</div><div class="grid-2"><div><label>展示タイム</label><input type="number" step="0.01" id="t4" value="6.68"></div><div><label>展示ST</label><input type="number" step="0.01" id="st4" value="0.11"></div></div></div>
        <div class="boat-row b5"><div class="boat-title">5号艇</div><div class="grid-2"><div><label>展示タイム</label><input type="number" step="0.01" id="t5" value="6.79"></div><div><label>展示ST</label><input type="number" step="0.01" id="st5" value="0.20"></div></div></div>
        <div class="boat-row b6"><div class="boat-title">6号艇</div><div class="grid-2"><div><label>展示タイム</label><input type="number" step="0.01" id="t6" value="6.74"></div><div><label>展示ST</label><input type="number" step="0.01" id="st6" value="0.14"></div></div></div>
    </div>

    <button onclick="runAiPrediction()">最強アルゴリズムでAI予想</button>

    <div id="loading" class="loading">⚡ Gemini AIが展開を猛烈に計算中...</div>
    <div id="result"></div>
</div>

<script>
// アプリ起動時に記憶されたキーを読み込む
window.onload = function() {
    const savedKey = localStorage.getItem('kyotei_gemini_key');
    if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
    }
};

async function runAiPrediction() {
    const apiKey = document.getElementById('apiKey').value;
    if (!apiKey) { alert('APIキーを入力してください'); return; }

    if (document.getElementById('saveKey').checked) {
        localStorage.setItem('kyotei_gemini_key', apiKey);
    } else {
        localStorage.removeItem('kyotei_gemini_key');
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';

    let dataText = "";
    for(let i=1; i<=6; i++) {
        const t = document.getElementById('t' + i).value;
        const st = document.getElementById('st' + i).value;
        dataText += `${i}号艇: 展示タイム:${t} / スタート展示ST:${st}\n`;
    }

    const promptMessage = `
あなたは競艇（ボートレース）のプロアナリストAIです。
提示された以下のシンプルな展示データに基づき、競艇の展開セオリーと【厳格なアルゴリズム】を適用して、最も的中確率の高い「3連単（5点）」と「2連単（3点）」の買い目、および詳細な展開予想を出力してください。

【アルゴリズム】
1. コース利(最大40点)：1コース=40、2コース=25、3コース=15、4コース=10、5コース=5、6コース=0
2. 展示タイム相対(最大30点)：最速艇に30点。最速から0.01秒遅れる毎に3点減点。展示6.6台は＋5点。
3. STの質(最大20点)：展示STが0.12以内なら20点。ドカ遅れ（0.20以上）やFは0点。

---
【レース展示データ】
${dataText}
---

【出力フォーマット（余計な挨拶は一切不要。これのみを出力してください）】
■ 的中率順・3連単買い目（厳選5点）
1. 〇-〇-〇 （〇%）
2. 〇-〇-〇 （〇%）
3. 〇-〇-〇 （〇%）
4. 〇-〇-〇 （〇%）
5. 〇-〇-〇 （〇%）

■ 的中率重視の「手堅い2連単」（厳選3点）
1. 〇-〇
2. 〇-〇
3. 〇-〇

■ 展開の論理的見解
`;

    // アドレス自動短縮バグを確実に突破する保護処理
    const s =;
    const url = String.fromCharCode.apply(null, s) + apiKey;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptMessage }] }]
            })
        });

        const data = await response.json();

        // 【最終バグ修正箇所】AIの返答テキストを確実に引き出す正しい公式の配列指定（[0]の階層）に完全に修復しました
        if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) {
            const aiText = data.candidates[0].content.parts[0].text;
            document.getElementById('result').innerText = aiText;
            document.getElementById('result').style.display = 'block';
        } else {
            if (data.error) {
                alert('Google AIエラー: ' + data.error.message);
            } else {
                alert('データ抽出エラーが発生しました。もう一度お試しください。');
            }
        }
    } catch (error) {
        console.error(error);
        alert('通信に失敗しました。インターネット接続を確認してください。');
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}
</script>

</body>
</html>
